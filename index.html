<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Jarvis · Em manutenção</title>
<link rel="icon" href="/brand/jarvis-32.png">
<style>
  :root{color-scheme:dark;--bg:#090c13;--panel:#111520;--line:#242a3a;--text:#eff1fa;--muted:#929bb2;--azul:#4f6bff;--violeta:#7c5cff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(ellipse at 70% -10%,#4f6bff33,transparent 60%),radial-gradient(ellipse at 10% 110%,#7c5cff26,transparent 55%),var(--bg);color:var(--text);font:15px/1.6 'Segoe UI',system-ui,Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
  main{max-width:460px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:40px 28px 34px;box-shadow:0 30px 90px #0007}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:26px;letter-spacing:-.5px;margin:20px 0 8px}
  p{color:var(--muted);margin:0 0 6px}
  .barra{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:26px auto 0;max-width:220px}
  .barra i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--azul),var(--violeta));animation:vai 1.8s ease-in-out infinite}
  @keyframes vai{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.barra i{animation:none;width:100%}}
  small{display:block;margin-top:22px;color:#6c7590;font-size:12px}
</style>
</head>
<body>
<main>
  <img src="/brand/jarvis-192.png" alt="Jarvis">
  <h1>Estamos em manutenção</h1>
  <p>O Jarvis está temporariamente fora do ar para manutenção.</p>
  <p>Voltamos em breve. Obrigado pela paciência.</p>
  <div class="barra" aria-hidden="true"><i></i></div>
  <small>Jarvis · ERP para e-commerce</small>
</main>
</body>
</html>
